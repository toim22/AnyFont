[workspace]
resolver = "2"
members = [
    "crates/anyfont-core",
    "crates/anyfont-sys",
    "crates/anyfont",
    "xtask",
]
# vendor/egui is egui 0.37.0 with a user interface text translator (see vendor/egui/README.md)
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AnyFont Team"]
license = "Proprietary"

[workspace.dependencies]
anyfont-core = { path = "crates/anyfont-core" }
anyfont-sys = { path = "crates/anyfont-sys" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
rustybuzz = "0.20"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
usvg = "0.49"
resvg = "0.49"
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
egui_kittest = "0.37"
rfd = "0.18"
dirs = "7"
arboard = "3.7"
log = "0.4"
parking_lot = "0.12"
ureq = { version = "3", features = ["json"] }
winresource = "0.1"
walkdir = "2.5"
sha2 = "0.11"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
# Win32 bindings (anyfont-sys); same major as AnyVector
windows = "0.62"
thiserror = "2"
roxmltree = "0.21"
miniz_oxide = "0.8"
unicode-general-category = "1.1"
unicode-script = "0.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[patch.crates-io]
egui = { path = "vendor/egui" }
