[package]
name = "anyfont-sys"
version.workspace = true
edition.workspace = true
description = "AnyFont - Windows integration (font registration, shell, elevation, logging)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
ttf-parser = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Panic on any write to the real font registration (registry, fonts folders, AddFontResource,
# broadcast, Recycle Bin, reboot). For test builds only; see docs/sys-api.md.
forbid-real-writes = []

[dev-dependencies]
tempfile = { workspace = true }
# Integration tests (tests/*.rs) build the library with the guard on.
anyfont-sys = { path = ".", features = ["forbid-real-writes"] }
