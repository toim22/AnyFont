<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 548 206" width="548" height="206">
  <!-- Generated by the xtask brand command (xtask/src/brand.rs) from anyfont-logo.svg; edit it there. -->
  <title>AnyFont – About banner</title>
  <rect width="548" height="206" fill="#000000"/>
  <svg x="352" y="26" width="172" height="154.89005" viewBox="150 160 955 860" overflow="visible">
  <title>AnyFont logo – letter A in a glowing type frame (the app icon without its rounded tile)</title>
  <defs>
    <path id="logo_glyph" transform="translate(415.53 755) scale(0.285 -0.2663)" d="M428 73V0H20V73L120 100L597 1352H887L1362 100L1464 73V0H867V73L1022 100L894 447H379L256 100ZM641 1150 420 557H856Z"/>
    <clipPath id="logo_outerClip"><rect x="95" y="82" width="1062" height="1062" rx="245"/></clipPath>
    <linearGradient id="logo_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2335"/><stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
    <radialGradient id="logo_gGreen"><stop offset="0" stop-color="#27e86a"/><stop offset="1" stop-color="#27e86a" stop-opacity="0"/></radialGradient>
    <radialGradient id="logo_gCyan"><stop offset="0" stop-color="#19e3ff"/><stop offset="1" stop-color="#19e3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="logo_gBlue"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#2f8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="logo_gOrange"><stop offset="0" stop-color="#ff8a1c"/><stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/></radialGradient>
    <radialGradient id="logo_gMagenta"><stop offset="0" stop-color="#ff2fb4"/><stop offset="1" stop-color="#ff2fb4" stop-opacity="0"/></radialGradient>
    <radialGradient id="logo_gPurple"><stop offset="0" stop-color="#9a5cff"/><stop offset="1" stop-color="#9a5cff" stop-opacity="0"/></radialGradient>
    <g id="logo_colors">
      <rect x="250" y="250" width="760" height="670" fill="#3a3f7a"/>
      <circle cx="610" cy="560" r="330" fill="url(#logo_gBlue)" opacity=".7"/>
      <circle cx="660" cy="250" r="300" fill="url(#logo_gCyan)"/>
      <circle cx="1000" cy="330" r="330" fill="url(#logo_gBlue)"/>
      <circle cx="250" cy="300" r="320" fill="url(#logo_gGreen)"/>
      <circle cx="250" cy="650" r="260" fill="url(#logo_gPurple)"/>
      <circle cx="440" cy="920" r="330" fill="url(#logo_gMagenta)"/>
      <circle cx="990" cy="880" r="380" fill="url(#logo_gOrange)"/>
      <circle cx="800" cy="900" r="220" fill="url(#logo_gOrange)" opacity=".8"/>
    </g>
    <filter id="logo_blurBig" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="logo_blurMid" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="logo_blurSm" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="logo_panelMask"><rect x="275" y="278" width="705" height="612" rx="105" fill="#fff"/></mask>
    <mask id="logo_rimMask"><rect x="275" y="278" width="705" height="612" rx="105" fill="none" stroke="#fff" stroke-width="12" filter="url(#logo_blurSm)"/></mask>
    <mask id="logo_haloSrc"><rect x="265" y="268" width="725" height="632" rx="115" fill="#fff"/></mask>
    <mask id="logo_haloMask">
      <rect x="95" y="82" width="1062" height="1062" fill="#fff"/>
      <rect x="275" y="278" width="705" height="612" rx="105" fill="#000"/>
    </mask>
    <radialGradient id="logo_panelShade" cx=".5" cy=".5" r=".62">
      <stop offset="0" stop-color="#0d1424" stop-opacity=".72"/>
      <stop offset=".65" stop-color="#0d1424" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0d1424" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo_glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo_aFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fd8"/>
      <stop offset=".3" stop-color="#f3d6ff"/>
      <stop offset=".5" stop-color="#b9ecff"/>
      <stop offset=".72" stop-color="#ffc77a"/>
      <stop offset="1" stop-color="#ff9a30"/>
    </linearGradient>
    <linearGradient id="logo_aTop" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7ff3ff"/>
      <stop offset=".35" stop-color="#9fe6ff" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo_aGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g>
    <!-- colored halo around the frame -->
    <g filter="url(#logo_blurBig)" opacity=".9"><g mask="url(#logo_haloSrc)"><use href="#logo_colors" xlink:href="#logo_colors"/></g></g>
    <!-- glass panel -->
    <g mask="url(#logo_panelMask)">
      <use href="#logo_colors" xlink:href="#logo_colors" filter="url(#logo_blurMid)"/>
      <rect x="275" y="278" width="705" height="612" fill="url(#logo_panelShade)"/>
      <rect x="275" y="278" width="705" height="612" fill="url(#logo_glassSheen)"/>
    </g>
    <!-- bright rim -->
    <g mask="url(#logo_rimMask)"><use href="#logo_colors" xlink:href="#logo_colors"/><rect x="275" y="278" width="705" height="612" fill="#fff" opacity=".35"/></g>
  </g>

  <!-- type guides -->
  <g fill="none" stroke-linecap="round">
    <line x1="388" y1="410" x2="866" y2="410" stroke="#8fe3e6" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="14 10"/>
    <line x1="388" y1="562" x2="866" y2="562" stroke="#9fd8ec" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="14 10"/>
    <line x1="384" y1="373" x2="384" y2="773" stroke="#e8f4ff" stroke-opacity=".6" stroke-width="2.5"/>
    <line x1="870" y1="373" x2="870" y2="773" stroke="#e8f4ff" stroke-opacity=".6" stroke-width="2.5"/>
    <line x1="384" y1="374" x2="870" y2="374" stroke="#e8f8ff" stroke-opacity=".75" stroke-width="3"/>
  </g>

  <!-- letter A: soft glow + layered fills -->
  <use href="#logo_glyph" xlink:href="#logo_glyph" fill="#bfefff" opacity=".45" filter="url(#logo_blurMid)"/>
  <use href="#logo_glyph" xlink:href="#logo_glyph" fill="url(#logo_aFill)"/>
  <use href="#logo_glyph" xlink:href="#logo_glyph" fill="url(#logo_aTop)"/>
  <use href="#logo_glyph" xlink:href="#logo_glyph" fill="url(#logo_aGloss)"/>

  <!-- baseline + handles -->
  <line x1="384" y1="775" x2="870" y2="775" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <rect x="367" y="357" width="34" height="34" rx="7" fill="#c9f5e4" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
  <rect x="853" y="357" width="34" height="34" rx="7" fill="#c7e6f6" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="384" cy="775" r="17" fill="#f6dff7" stroke="#ffffff" stroke-width="4"/>
  <circle cx="384" cy="775" r="8" fill="#ffffff"/>
  <circle cx="870" cy="775" r="17" fill="#fbe6d4" stroke="#ffffff" stroke-width="4"/>
  <circle cx="870" cy="775" r="8" fill="#ffffff"/>
</svg>
  <text x="66" y="118" font-family="Segoe UI" font-weight="600" font-size="62" fill="#ffffff" letter-spacing="-0.5">AnyFont</text>
  <text x="70" y="150" font-family="Segoe UI" font-size="19" fill="#ffffff">Font Manager</text>
</svg>
