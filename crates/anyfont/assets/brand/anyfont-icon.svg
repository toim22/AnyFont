<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="95 82 1062 1062" width="1024" height="1024">
  <title>App icon – letter A in a glowing type frame</title>
  <defs>
    <path id="glyph" transform="translate(415.53 755) scale(0.285 -0.2663)" d="M428 73V0H20V73L120 100L597 1352H887L1362 100L1464 73V0H867V73L1022 100L894 447H379L256 100ZM641 1150 420 557H856Z"/>
    <clipPath id="outerClip"><rect x="95" y="82" width="1062" height="1062" rx="245"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2335"/><stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
    <radialGradient id="gGreen"><stop offset="0" stop-color="#27e86a"/><stop offset="1" stop-color="#27e86a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gCyan"><stop offset="0" stop-color="#19e3ff"/><stop offset="1" stop-color="#19e3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBlue"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#2f8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gOrange"><stop offset="0" stop-color="#ff8a1c"/><stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/></radialGradient>
    <radialGradient id="gMagenta"><stop offset="0" stop-color="#ff2fb4"/><stop offset="1" stop-color="#ff2fb4" stop-opacity="0"/></radialGradient>
    <radialGradient id="gPurple"><stop offset="0" stop-color="#9a5cff"/><stop offset="1" stop-color="#9a5cff" stop-opacity="0"/></radialGradient>
    <g id="colors">
      <rect x="250" y="250" width="760" height="670" fill="#3a3f7a"/>
      <circle cx="610" cy="560" r="330" fill="url(#gBlue)" opacity=".7"/>
      <circle cx="660" cy="250" r="300" fill="url(#gCyan)"/>
      <circle cx="1000" cy="330" r="330" fill="url(#gBlue)"/>
      <circle cx="250" cy="300" r="320" fill="url(#gGreen)"/>
      <circle cx="250" cy="650" r="260" fill="url(#gPurple)"/>
      <circle cx="440" cy="920" r="330" fill="url(#gMagenta)"/>
      <circle cx="990" cy="880" r="380" fill="url(#gOrange)"/>
      <circle cx="800" cy="900" r="220" fill="url(#gOrange)" opacity=".8"/>
    </g>
    <filter id="blurBig" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="blurMid" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurSm" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="panelMask"><rect x="275" y="278" width="705" height="612" rx="105" fill="#fff"/></mask>
    <mask id="rimMask"><rect x="275" y="278" width="705" height="612" rx="105" fill="none" stroke="#fff" stroke-width="12" filter="url(#blurSm)"/></mask>
    <mask id="haloSrc"><rect x="265" y="268" width="725" height="632" rx="115" fill="#fff"/></mask>
    <mask id="haloMask">
      <rect x="95" y="82" width="1062" height="1062" fill="#fff"/>
      <rect x="275" y="278" width="705" height="612" rx="105" fill="#000"/>
    </mask>
    <radialGradient id="panelShade" cx=".5" cy=".5" r=".62">
      <stop offset="0" stop-color="#0d1424" stop-opacity=".72"/>
      <stop offset=".65" stop-color="#0d1424" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0d1424" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fd8"/>
      <stop offset=".3" stop-color="#f3d6ff"/>
      <stop offset=".5" stop-color="#b9ecff"/>
      <stop offset=".72" stop-color="#ffc77a"/>
      <stop offset="1" stop-color="#ff9a30"/>
    </linearGradient>
    <linearGradient id="aTop" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7ff3ff"/>
      <stop offset=".35" stop-color="#9fe6ff" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base tile -->
  <rect x="95" y="82" width="1062" height="1062" rx="245" fill="url(#bg)"/>

  <g clip-path="url(#outerClip)">
    <!-- colored halo spilling onto the dark tile -->
    <g filter="url(#blurBig)" opacity=".9"><g mask="url(#haloSrc)"><use href="#colors" xlink:href="#colors"/></g></g>
    <!-- glass panel -->
    <g mask="url(#panelMask)">
      <use href="#colors" xlink:href="#colors" filter="url(#blurMid)"/>
      <rect x="275" y="278" width="705" height="612" fill="url(#panelShade)"/>
      <rect x="275" y="278" width="705" height="612" fill="url(#glassSheen)"/>
    </g>
    <!-- bright rim -->
    <g mask="url(#rimMask)"><use href="#colors" xlink:href="#colors"/><rect x="275" y="278" width="705" height="612" fill="#fff" opacity=".35"/></g>
  </g>

  <!-- type guides -->
  <g fill="none" stroke-linecap="round">
    <line x1="388" y1="410" x2="866" y2="410" stroke="#8fe3e6" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="14 10"/>
    <line x1="388" y1="562" x2="866" y2="562" stroke="#9fd8ec" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="14 10"/>
    <line x1="384" y1="373" x2="384" y2="773" stroke="#e8f4ff" stroke-opacity=".6" stroke-width="2.5"/>
    <line x1="870" y1="373" x2="870" y2="773" stroke="#e8f4ff" stroke-opacity=".6" stroke-width="2.5"/>
    <line x1="384" y1="374" x2="870" y2="374" stroke="#e8f8ff" stroke-opacity=".75" stroke-width="3"/>
  </g>

  <!-- letter A: soft glow + layered fills -->
  <use href="#glyph" xlink:href="#glyph" fill="#bfefff" opacity=".45" filter="url(#blurMid)"/>
  <use href="#glyph" xlink:href="#glyph" fill="url(#aFill)"/>
  <use href="#glyph" xlink:href="#glyph" fill="url(#aTop)"/>
  <use href="#glyph" xlink:href="#glyph" fill="url(#aGloss)"/>

  <!-- baseline + handles -->
  <line x1="384" y1="775" x2="870" y2="775" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <rect x="367" y="357" width="34" height="34" rx="7" fill="#c9f5e4" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
  <rect x="853" y="357" width="34" height="34" rx="7" fill="#c7e6f6" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="384" cy="775" r="17" fill="#f6dff7" stroke="#ffffff" stroke-width="4"/>
  <circle cx="384" cy="775" r="8" fill="#ffffff"/>
  <circle cx="870" cy="775" r="17" fill="#fbe6d4" stroke="#ffffff" stroke-width="4"/>
  <circle cx="870" cy="775" r="8" fill="#ffffff"/>
</svg>
